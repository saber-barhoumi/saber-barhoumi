<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="446" viewBox="0 0 800 446" role="img" aria-labelledby="t d">
<title id="t">CryptoVisionAI — pipeline</title><desc id="d">Pipeline: Binance data, 30-candle chart images, 5-bar forward-return labels, CNN model, BUY/SELL/HOLD output. Trained weights and metrics are not published.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04070d"/><stop offset="1" stop-color="#0a1424"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset=".25" stop-color="#00e5ff"/><stop offset=".75" stop-color="#2979ff"/><stop offset="1" stop-color="#9d5cff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#00e5ff" stroke-opacity=".07"/></pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.fade{animation:fade .7s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.glitch{animation:glitch 6s infinite}
@keyframes glitch{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(-4px,1px)}94%{transform:translate(4px,-1px)}96%{transform:translate(-2px,0)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.scan{animation:scan 5s linear infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(var(--sh,300px))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="800" height="446" rx="10" fill="url(#bg)"/><rect width="800" height="446" rx="10" fill="url(#grid)"/><rect x=".5" y=".5" width="799" height="445" rx="10" fill="none" stroke="#14324d"/><path d="M28 10H10V28" fill="none" stroke="#9d5cff" stroke-width="3"/><path d="M772 10H790V28" fill="none" stroke="#9d5cff" stroke-width="3"/><path d="M28 436H10V418" fill="none" stroke="#9d5cff" stroke-width="3"/><path d="M772 436H790V418" fill="none" stroke="#9d5cff" stroke-width="3"/><text x="32" y="44" font-size="14" fill="#9d5cff" font-weight="bold" text-anchor="start" >FEATURED PROJECT // AI / ML</text><text x="32" y="80" font-size="32" fill="#ffffff" font-weight="bold" text-anchor="start" filter="url(#glow)">CryptoVisionAI</text><text x="32" y="106" font-size="15" fill="#00e5ff" font-weight="normal" text-anchor="start" >candlestick charts → CNN → BUY / SELL / HOLD classification</text><rect x="32" y="128" width="136" height="110" rx="8" fill="#08111f" stroke="#00e5ff99"/><text x="44" y="152" font-size="13" fill="#00e5ff" font-weight="bold" text-anchor="start" >01 DATA</text><text x="44" y="178" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start" >Binance 1-min</text><text x="44" y="195" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start" >OHLCV</text><text x="44" y="214" font-size="11.5" fill="#7f97b3" font-weight="normal" text-anchor="start" >Kaggle dataset ·</text><text x="44" y="229" font-size="11.5" fill="#7f97b3" font-weight="normal" text-anchor="start" >parquet</text><path d="M170 183h9" stroke="#00e5ff" stroke-width="2"/><path d="M177 178l6 5l-6 5z" fill="#00e5ff"/><rect x="183" y="128" width="136" height="110" rx="8" fill="#08111f" stroke="#00e5ff99"/><text x="195" y="152" font-size="13" fill="#00e5ff" font-weight="bold" text-anchor="start" >02 IMAGE</text><text x="195" y="178" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start" >30-candle</text><text x="195" y="195" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start" >windows</text><text x="195" y="214" font-size="11.5" fill="#7f97b3" font-weight="normal" text-anchor="start" >224×224 chart</text><text x="195" y="229" font-size="11.5" fill="#7f97b3" font-weight="normal" text-anchor="start" >images</text><path d="M321 183h9" stroke="#00e5ff" stroke-width="2"/><path d="M328 178l6 5l-6 5z" fill="#00e5ff"/><rect x="334" y="128" width="136" height="110" rx="8" fill="#08111f" stroke="#00e5ff99"/><text x="346" y="152" font-size="13" fill="#00e5ff" font-weight="bold" text-anchor="start" >03 LABEL</text><text x="346" y="178" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start" >5-bar forward</text><text x="346" y="195" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start" >return</text><text x="346" y="214" font-size="11.5" fill="#7f97b3" font-weight="normal" text-anchor="start" >±0.15% threshold</text><path d="M472 183h9" stroke="#00e5ff" stroke-width="2"/><path d="M479 178l6 5l-6 5z" fill="#00e5ff"/><rect x="485" y="128" width="136" height="110" rx="8" fill="#08111f" stroke="#9d5cff99"/><text x="497" y="152" font-size="13" fill="#9d5cff" font-weight="bold" text-anchor="start" >04 MODEL</text><text x="497" y="178" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start" >CNN (custom /</text><text x="497" y="195" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start" >ResNet50)</text><text x="497" y="214" font-size="11.5" fill="#7f97b3" font-weight="normal" text-anchor="start" >TensorFlow +</text><text x="497" y="229" font-size="11.5" fill="#7f97b3" font-weight="normal" text-anchor="start" >PyTorch</text><path d="M623 183h9" stroke="#00e5ff" stroke-width="2"/><path d="M630 178l6 5l-6 5z" fill="#00e5ff"/><rect x="636" y="128" width="136" height="110" rx="8" fill="#08111f" stroke="#9d5cff99"/><text x="648" y="152" font-size="13" fill="#9d5cff" font-weight="bold" text-anchor="start" >05 OUTPUT</text><text x="648" y="178" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start" >3-class signal</text><text x="648" y="214" font-size="11.5" fill="#7f97b3" font-weight="normal" text-anchor="start" >BUY · SELL ·</text><text x="648" y="229" font-size="11.5" fill="#7f97b3" font-weight="normal" text-anchor="start" >HOLD</text><text x="32" y="270" font-size="13" fill="#7f97b3" font-weight="normal" text-anchor="start" >// LABEL BALANCE (as documented in the repo: 254,424 images · 70/15/15 split)</text><rect x="32.0" y="282" width="192.0" height="26" rx="4" fill="#39ff96" opacity=".85"/><text x="128.01999999999998" y="300" font-size="13" fill="#04070d" font-weight="bold" text-anchor="middle" >BUY 26.5%</text><rect x="227.0" y="282" width="195.0" height="26" rx="4" fill="#9d5cff" opacity=".85"/><text x="324.532" y="300" font-size="13" fill="#04070d" font-weight="bold" text-anchor="middle" >SELL 26.9%</text><rect x="425.0" y="282" width="340.0" height="26" rx="4" fill="#2979ff" opacity=".85"/><text x="595.012" y="300" font-size="13" fill="#04070d" font-weight="bold" text-anchor="middle" >HOLD 46.6%</text><text x="32" y="340" font-size="13" fill="#7f97b3" font-weight="normal" text-anchor="start" >// STATUS — what the repository actually contains</text><rect x="32" y="352" width="372" height="74" rx="8" fill="#07160f" stroke="#39ff9699"/><text x="46" y="374" font-size="13" fill="#39ff96" font-weight="bold" text-anchor="start" >● IMPLEMENTED</text><text x="46" y="394" font-size="11.5" fill="#d6e6f5" font-weight="normal" text-anchor="start" >dataset pipeline · model definitions ·</text><text x="46" y="410" font-size="11.5" fill="#d6e6f5" font-weight="normal" text-anchor="start" >training scripts (TensorFlow + PyTorch)</text><rect x="416" y="352" width="352" height="74" rx="8" fill="#110c22" stroke="#9d5cff99"/><text x="430" y="374" font-size="13" fill="#9d5cff" font-weight="bold" text-anchor="start" >○ NOT PUBLISHED</text><text x="430" y="394" font-size="11.5" fill="#d6e6f5" font-weight="normal" text-anchor="start" >trained weights · accuracy figures ·</text><text x="430" y="410" font-size="11.5" fill="#d6e6f5" font-weight="normal" text-anchor="start" >backtest results</text>
</svg>

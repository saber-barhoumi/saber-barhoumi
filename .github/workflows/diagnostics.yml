name: Update profile diagnostics

# Regenerates assets/diagnostics.svg from live GitHub API data (see scripts/generate_diagnostics.py).
# No third-party service is involved, so the panel cannot break because an external stats host is down.

on:
  schedule:
    - cron: "17 3 * * *"      # every day at 03:17 UTC
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate_diagnostics.py"
      - ".github/workflows/diagnostics.yml"

permissions:
  contents: write              # needed to commit the refreshed SVG back to this repository

concurrency:
  group: profile-diagnostics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate assets/diagnostics.svg
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OPTIONAL secret: only enables the "contributions (12 months)" tile and heat strip.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python3 scripts/generate_diagnostics.py

      - name: Commit if the SVG changed
        run: |
          if git diff --quiet -- assets/diagnostics.svg; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/diagnostics.svg
          git commit -m "chore: refresh profile diagnostics"
          git push
